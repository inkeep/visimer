name: Publish

# Responsibility split (see agents-private for the other half):
#
#   agents-private  -> owns the "Version Packages (visimer)" PR for the 5
#                      @visimer/* packages. When that PR merges, copybara
#                      syncs the version bumps here and deletes the
#                      .changeset/*.md files.
#   inkeep/visimer  -> THIS file. On push to main with no pending
#                      changesets, publish the bumped packages to npm via
#                      Trusted Publishing (OIDC).
#
# We intentionally do NOT create Version Packages PRs here. A .changeset/*.md
# on main means copybara hasn't caught up yet (or someone added a changeset
# directly to this repo — shouldn't happen). Either way this workflow no-ops
# on that run; the next sync consumes the changesets once the corresponding
# Version PR merges on agents-private.

on:
  workflow_dispatch:
  push:
    paths:
      - ".changeset/**"
      - "packages/**"
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: visimer-publish
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installing pnpm
        id: pnpm-setup
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        continue-on-error: true
        timeout-minutes: 2
        with:
          install: false
      - name: Waiting before retrying the pnpm download
        if: steps.pnpm-setup.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::pnpm-setup-retry=started. The first pnpm/setup attempt failed or hit its 2-minute bound; its error is in the Installing pnpm step. Retrying once in 20s."
          sleep 20
      - name: Installing pnpm (retry after a failed download)
        id: pnpm-setup-retry
        if: steps.pnpm-setup.outcome == 'failure'
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        timeout-minutes: 2
        with:
          install: false
      - name: Recording the pnpm download retry result
        if: ${{ !cancelled() && steps.pnpm-setup.outcome == 'failure' }}
        shell: bash
        env:
          RETRY_OUTCOME: ${{ steps.pnpm-setup-retry.outcome }}
        run: |
          if [[ "$RETRY_OUTCOME" == success ]]; then
            echo "::notice::pnpm-setup-retry=recovered. The first pnpm/setup attempt failed and the retry installed pnpm."
          else
            echo "::error::pnpm-setup-retry=exhausted retry=${RETRY_OUTCOME}. Both pnpm/setup attempts failed; their errors are in the two Installing pnpm steps."
          fi

      - name: Setup Node for OIDC publishing
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Pinned to the 11.x line (registry tag next-11), not latest: npm 12.0.0
      # ships without the bundled sigstore module libnpmpublish requires, so
      # provenance publishes fail with MODULE_NOT_FOUND. Bump only after
      # verifying a provenance publish works on the new major.
      - name: Ensure npm 11.5.1+ for OIDC support
        run: |
          if npm install -g npm@11 2>/dev/null; then
            echo "npm upgraded via bundled npm"
          else
            echo "::warning::Bundled npm broken, bootstrapping from tarball"
            NPM_VER=$(node -e "fetch('https://registry.npmjs.org/npm/next-11').then(r=>r.json()).then(d=>console.log(d.version))")
            curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VER}.tgz" | tar xz -C /tmp
            node /tmp/package/bin/npm-cli.js install -g "npm@${NPM_VER}"
            rm -rf /tmp/package
          fi
          echo "npm $(npm --version)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Detect changesets
        id: detect
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' -not -name 'README.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found $count pending changeset(s). Agents-private owns Version Packages PR creation; skipping publish."
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets; will attempt to publish any unreleased versions."
          fi

      # "Version PR got merged on agents-private, copybara delivered the
      # bump, now ship it." `changeset publish` is idempotent — versions
      # already on npm no-op, so re-running this workflow is always safe.
      - name: Publish
        id: publish
        if: steps.detect.outputs.has_changesets == 'false'
        run: |
          set -euo pipefail
          # Provenance is required for npm Trusted Publishing attestations.
          # This repo's @changesets/cli does not know a --provenance flag
          # (that errored the first release run), so it goes through npm
          # config instead — npm reads it when changesets shells out.
          pnpm changeset publish | tee /tmp/publish.log

          # Changesets emits "packages published successfully" after >=1
          # package ships; a no-op run (nothing ahead of npm) does not.
          if ! grep -q "packages published successfully" /tmp/publish.log; then
            echo "Nothing published — all package versions already on npm."
            exit 0
          fi

          # All @visimer/* packages share a version (fixed group in
          # .changeset/config.json), so core's package.json is authoritative.
          VERSION=$(node -p "require('./packages/core/package.json').version")

          # Ground-truth check: verify every workspace package actually
          # resolves on npm at VERSION before pushing tags.
          MISSING=()
          for pkg_json in packages/*/package.json; do
            PKG_NAME=$(node -p "require('./$pkg_json').name" 2>/dev/null || echo "")
            IS_PRIVATE=$(node -p "require('./$pkg_json').private ?? false" 2>/dev/null || echo "false")
            [ -z "$PKG_NAME" ] && continue
            [ "$IS_PRIVATE" = "true" ] && continue
            MISSING+=("$PKG_NAME")
          done

          WAIT_MINUTES=20
          DEADLINE=$((SECONDS + WAIT_MINUTES * 60))
          declare -A LAST_ERROR=()
          while :; do
            STILL_MISSING=()
            for PKG_NAME in "${MISSING[@]}"; do
              STATUS=0
              OUTPUT=$(npm view "$PKG_NAME@$VERSION" version --prefer-online 2>&1) || STATUS=$?
              if [ "$STATUS" -ne 0 ]; then
                STILL_MISSING+=("$PKG_NAME")
                LAST_ERROR[$PKG_NAME]="exit $STATUS: $(printf '%s\n' "$OUTPUT" | sed -e '/^npm error *[0-9]*$/d' | sed -n '1,3p' | tr '\n' ' ')"
              fi
            done
            MISSING=("${STILL_MISSING[@]}")
            if [ ${#MISSING[@]} -eq 0 ] || [ "$SECONDS" -ge "$DEADLINE" ]; then
              break
            fi
            echo "Waiting for npm to serve v$VERSION of: ${MISSING[*]}"
            sleep 20
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::changeset publish reported success, but npm did not serve these packages at v$VERSION within $WAIT_MINUTES minutes: ${MISSING[*]}"
            for PKG_NAME in "${MISSING[@]}"; do
              echo "::error::$PKG_NAME@$VERSION, last npm view: ${LAST_ERROR[$PKG_NAME]}"
            done
            echo "::error::npm may still be scanning or may have held the version; check it on npmjs.com. A re-run publishes nothing and pushes no tags, so once npm serves every package, push the @visimer/*@$VERSION tags by hand."
            exit 1
          fi

          echo "All @visimer/* packages verified present on npm at v$VERSION."

          # `changeset publish` created local tags (@visimer/core@X.Y.Z, ...);
          # push them so the release is discoverable from the repo.
          git push origin --tags
        env:
          HUSKY: 0
          NPM_CONFIG_PROVENANCE: "true"
